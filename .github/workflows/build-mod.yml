name: Build Carbon Client

on:
  push:
    branches:
      - arena/01a0ffe4-carbon-fabric
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build mod
        id: gradle
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon clean build --stacktrace > build.log 2>&1
          build_status=$?
          cat build.log
          if [ "$build_status" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path("build.log").read_text(errors="replace").splitlines()
          detail = "\n".join(lines[-80:])[-12000:]
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("### Gradle build failure\n\n```text\n")
              stream.write(detail)
              stream.write("\n```\n")

          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failure::{escaped}")
          PY
            exit "$build_status"
          fi

      - name: Publish JAR object for Arena retrieval
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          jars = sorted(Path("build/libs").glob("*.jar"))
          candidates = [jar for jar in jars if not jar.name.endswith("-sources.jar")]
          if len(candidates) != 1:
              raise SystemExit(f"Expected one mod JAR, found: {[jar.name for jar in candidates]}")

          jar = candidates[0]
          payload = json.dumps({
              "content": base64.b64encode(jar.read_bytes()).decode("ascii"),
              "encoding": "base64",
          }).encode("utf-8")
          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              blob_sha = json.load(response)["sha"]

          print(f"::notice title=Carbon mod JAR::{jar.name} git-blob-sha={blob_sha}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"Carbon mod JAR: `{jar.name}`\nGit blob SHA: `{blob_sha}`\n")
          PY

      - name: Publish downloadable test release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.0-test.6"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $tag" >&2
            exit 1
          fi
          gh release create "$tag" build/libs/carbonclient-1.0.0.jar \
            --title "Carbon Client 1.0.0 Complete Menu Rebuild" \
            --notes "Minecraft 26.2 PC test build, compiled with Java 25. Requires Fabric Loader 0.19.5 or newer and Fabric API 0.161.0+26.2 or newer. Right Shift opens Carbon's single module menu; F8 opens the separate glass-rendering test screen; F7 toggles layout debug. This rebuild replaces the menu's drawing and hit-testing path with one sidebar-based interface backed by Carbon's live module registry and config. It includes working category/search filters, module enable controls, typed per-module settings, presets, saved profiles, the local username and 3D skin-head portrait (with a visible face fallback), plus a persistent UI scale control. The deliberate solid charcoal theme is the first-run default; the same menu's settings switch to the optional glass finish. The animated test pattern remains F8-only. The JAR is CI-built; in-game verification is still needed. This release is immutable: the workflow refuses to replace an existing test.6 release." \
            --prerelease --target "$GITHUB_REF_NAME"

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: carbonclient-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carbonclient-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
